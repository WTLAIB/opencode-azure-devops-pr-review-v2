name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Ubuntu 22.04 / Node 22
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install the compiler of the terminal panel (development only; the package has no dependency)
        run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - name: Install the tested host (OpenCode 2.3.0, TESTED_HOST_VERSION in src/host.mjs) into a disposable prefix
        run: npm install --prefix "$RUNNER_TEMP/azpr-host" --no-audit --no-fund @opencode/cli@2.3.0
      - name: Exercise fresh installed package and host lifecycle
        run: node tests/host-v2-smoke.mjs "$RUNNER_TEMP/azpr-host/node_modules/.bin/opencode"
      - name: Exercise replacement package and host lifecycle
        run: node tests/host-v2-smoke.mjs "$RUNNER_TEMP/azpr-host/node_modules/.bin/opencode" --replace
      - name: Exercise native packed package, first-run setup and external configuration
        run: node tests/host-v2-smoke.mjs "$RUNNER_TEMP/azpr-host/node_modules/.bin/opencode" --native
      - name: Exercise sharded review, overflow split and idempotent publication at scale
        run: node tests/host-v2-comment-scale.mjs "$RUNNER_TEMP/azpr-host/node_modules/.bin/opencode"
      - name: Exercise a refused background summary followed by a permanent failure
        run: node tests/host-v2-background-compaction.mjs "$RUNNER_TEMP/azpr-host/node_modules/.bin/opencode"
      - name: Exercise the scale review with debug off, where each run deletes its sessions when it ends
        run: node tests/host-v2-comment-scale.mjs "$RUNNER_TEMP/azpr-host/node_modules/.bin/opencode" --cleanup
      - name: Exercise an unfinished review with debug off, which keeps only the session holding its draft
        run: node tests/host-v2-background-compaction.mjs "$RUNNER_TEMP/azpr-host/node_modules/.bin/opencode" --cleanup
      - name: Install tmux, in which the terminal fixtures run the real TUI
        run: command -v tmux >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq tmux; }
      - name: Exercise the terminal panel in the real TUI, installed from source
        run: node tests/host-v2-tui-panel.mjs "$RUNNER_TEMP/azpr-host/node_modules/.bin/opencode"
      - name: Exercise the terminal panel as the plugin manager installs the package
        run: node tests/host-v2-tui-panel.mjs "$RUNNER_TEMP/azpr-host/node_modules/.bin/opencode" --native
      - name: Exercise setup in the real TUI, installed from source
        run: node tests/host-v2-tui-setup.mjs "$RUNNER_TEMP/azpr-host/node_modules/.bin/opencode"
      - name: Exercise setup in the real TUI as the plugin manager installs the package
        run: node tests/host-v2-tui-setup.mjs "$RUNNER_TEMP/azpr-host/node_modules/.bin/opencode" --native
