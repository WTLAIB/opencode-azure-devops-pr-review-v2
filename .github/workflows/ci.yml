name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Ubuntu 22.04 / Node 22
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - name: Install the tested host (OpenCode 2.1.4, TESTED_HOST_VERSION in src/host.mjs) into a disposable prefix
        run: npm install --prefix "$RUNNER_TEMP/azpr-host" --no-audit --no-fund @opencode/cli@2.1.4
      - name: Exercise fresh installed package and host lifecycle
        run: node tests/host-v2-smoke.mjs "$RUNNER_TEMP/azpr-host/node_modules/.bin/opencode"
      - name: Exercise replacement package and host lifecycle
        run: node tests/host-v2-smoke.mjs "$RUNNER_TEMP/azpr-host/node_modules/.bin/opencode" --replace
      - name: Exercise native packed package, first-run setup and external configuration
        run: node tests/host-v2-smoke.mjs "$RUNNER_TEMP/azpr-host/node_modules/.bin/opencode" --native
      - name: Exercise sharded review, overflow split and idempotent publication at scale
        run: node tests/host-v2-comment-scale.mjs "$RUNNER_TEMP/azpr-host/node_modules/.bin/opencode"
      - name: Exercise a refused background summary followed by a permanent failure
        run: node tests/host-v2-background-compaction.mjs "$RUNNER_TEMP/azpr-host/node_modules/.bin/opencode"
