<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1100" viewBox="0 0 1200 1100" role="img" aria-labelledby="title desc"><title id="title">Four-step quick review walkthrough</title><desc id="desc">Synthetic example: run pr-check and pr-quick with an Azure pull request URL, preview with pr-comment, then optionally publish with pr-comment --publish. No model call or Azure publication was made for this illustration.</desc><rect x="0" y="0" width="1200" height="1100" rx="0" fill="#f2f6fb" stroke="none"/><text x="42" y="47" fill="#005a9e" font-family="Arial, sans-serif" font-size="14" font-weight="700">ILLUSTRATIVE EXAMPLE / SYNTHETIC PR</text><text x="42" y="99" fill="#172b4d" font-family="Arial, sans-serif" font-size="34" font-weight="700">Your first review, step by step</text><rect x="42" y="142" width="1118" height="204" rx="12" fill="#ffffff" stroke="#dce5ef"/><text x="66" y="178" fill="#172b4d" font-family="Arial, sans-serif" font-size="24" font-weight="700">1. Check setup</text><text x="66" y="218" fill="#005a9e" font-family="Consolas, monospace" font-size="24" font-weight="700">/pr-check &lt;azure-pr-url&gt;</text><text x="66" y="258" fill="#005a9e" font-family="Arial, sans-serif" font-size="20" font-weight="700">PR access and model readiness</text><text x="66" y="295" fill="#172b4d" font-family="Arial, sans-serif" font-size="20" font-weight="400">Check PR, source and discussion access, plus plugin configuration and model readiness.</text><text x="66" y="326" fill="#52637b" font-family="Arial, sans-serif" font-size="17" font-weight="400">This command does not call a review model.</text><rect x="42" y="370" width="1118" height="204" rx="12" fill="#ffffff" stroke="#dce5ef"/><text x="66" y="406" fill="#172b4d" font-family="Arial, sans-serif" font-size="24" font-weight="700">2. Run a quick review</text><text x="66" y="446" fill="#005a9e" font-family="Consolas, monospace" font-size="24" font-weight="700">/pr-quick &lt;azure-pr-url&gt;</text><text x="66" y="486" fill="#8a5900" font-family="Arial, sans-serif" font-size="20" font-weight="700">REPORTED · verification: none</text><text x="66" y="523" fill="#172b4d" font-family="Arial, sans-serif" font-size="20" font-weight="400">One reviewer per shard covers function and risk. The example finding: later pages are empty.</text><text x="66" y="554" fill="#52637b" font-family="Arial, sans-serif" font-size="17" font-weight="400">No independent verifier. A session can make several model requests.</text><rect x="42" y="598" width="1118" height="204" rx="12" fill="#ffffff" stroke="#dce5ef"/><text x="66" y="634" fill="#172b4d" font-family="Arial, sans-serif" font-size="24" font-weight="700">3. Preview comments</text><text x="66" y="674" fill="#005a9e" font-family="Consolas, monospace" font-size="24" font-weight="700">/pr-comment</text><text x="66" y="714" fill="#005a9e" font-family="Arial, sans-serif" font-size="20" font-weight="700">Preview · no Azure write</text><text x="66" y="751" fill="#172b4d" font-family="Arial, sans-serif" font-size="20" font-weight="400">A model plans the inline comment and summary. Review the proposed text before publishing.</text><text x="66" y="782" fill="#52637b" font-family="Arial, sans-serif" font-size="17" font-weight="400">Comment planning is additional model work.</text><rect x="42" y="826" width="1118" height="204" rx="12" fill="#ffffff" stroke="#dce5ef"/><text x="66" y="862" fill="#172b4d" font-family="Arial, sans-serif" font-size="24" font-weight="700">4. Publish when ready</text><text x="66" y="902" fill="#005a9e" font-family="Consolas, monospace" font-size="24" font-weight="700">/pr-comment --publish</text><text x="66" y="942" fill="#176b48" font-family="Arial, sans-serif" font-size="20" font-weight="700">Optional · explicit Azure write</text><text x="66" y="979" fill="#172b4d" font-family="Arial, sans-serif" font-size="20" font-weight="400">The runtime rechecks the PR and publishes the saved preview, skipping existing markers.</text><text x="66" y="1010" fill="#52637b" font-family="Arial, sans-serif" font-size="17" font-weight="400">Shown as a workflow step only. Nothing was published for this demo.</text><text x="42" y="1080" fill="#52637b" font-family="Arial, sans-serif" font-size="17" font-weight="400">Illustrative example / synthetic PR. No live model call or Azure publication.</text></svg>
