<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1088" viewBox="0 0 1200 1088" role="img" aria-labelledby="title desc"><title id="title">Azure DevOps comment format: synthetic quick-review example</title><desc id="desc">Illustrative layout, not an Azure screenshot. One medium finding about pagination is shown as an inline comment and a summary index. Quick review is explicitly not independently verified. Exact accessible comment text is linked in the demo guide.</desc><rect x="0" y="0" width="1200" height="1088" rx="0" fill="#f2f6fb" stroke="none"/><text x="42" y="47" fill="#005a9e" font-family="Arial, sans-serif" font-size="14" font-weight="700">ILLUSTRATIVE EXAMPLE / SYNTHETIC PR</text><text x="42" y="94" fill="#172b4d" font-family="Arial, sans-serif" font-size="34" font-weight="700">Review findings, where your team works.</text><text x="42" y="128" fill="#52637b" font-family="Arial, sans-serif" font-size="19" font-weight="400">Azure DevOps-style layout · Real comment renderer · Hand-written fixture</text><rect x="40" y="156" width="1120" height="552" rx="14" fill="#ffffff" stroke="#dce5ef"/><rect x="40" y="156" width="1120" height="46" rx="12" fill="#005a9e" stroke="none"/><rect x="40" y="184" width="1120" height="18" rx="0" fill="#005a9e" stroke="none"/><text x="64" y="186" fill="#ffffff" font-family="Arial, sans-serif" font-size="19" font-weight="700">Example project  /  Pull request #42  /  Files</text><text x="64" y="236" fill="#172b4d" font-family="Consolas, monospace" font-size="19" font-weight="700">src/pagination.js</text><rect x="64" y="254" width="1072" height="118" rx="8" fill="#f6f8fa" stroke="none"/><rect x="64" y="312" width="1072" height="26" rx="0" fill="#e7f4ec" stroke="none"/><text x="82" y="279" fill="#172b4d" font-family="Consolas, monospace" font-size="18" font-weight="400">1   export function page(items, size, offset) {</text><text x="82" y="305" fill="#172b4d" font-family="Consolas, monospace" font-size="18" font-weight="400">2     const start = offset * size;</text><text x="82" y="331" fill="#172b4d" font-family="Consolas, monospace" font-size="18" font-weight="400">3     return items.slice(start, size);</text><text x="82" y="357" fill="#172b4d" font-family="Consolas, monospace" font-size="18" font-weight="400">4   }</text><circle cx="77" cy="409" r="8" fill="#b87900"/><text x="96" y="416" fill="#172b4d" font-family="Arial, sans-serif" font-size="24" font-weight="700">medium: Later pages are empty</text><text x="64" y="460" fill="#005a9e" font-family="Arial, sans-serif" font-size="17" font-weight="700">Summary</text><text x="64" y="486" fill="#172b4d" font-family="Arial, sans-serif" font-size="20" font-weight="400">The second and later pages return no items.</text><text x="64" y="525" fill="#005a9e" font-family="Arial, sans-serif" font-size="17" font-weight="700">Evidence</text><text x="64" y="551" fill="#172b4d" font-family="Arial, sans-serif" font-size="20" font-weight="400">page([1, 2, 3, 4], 2, 1) returns [] instead of [3, 4].</text><text x="64" y="590" fill="#005a9e" font-family="Arial, sans-serif" font-size="17" font-weight="700">Suggested fix</text><text x="64" y="616" fill="#172b4d" font-family="Arial, sans-serif" font-size="20" font-weight="400">Use start + size as the exclusive end of the slice.</text><path d="M64 635H1136" stroke="#dce5ef"/><text x="64" y="659" fill="#52637b" font-family="Arial, sans-serif" font-size="16" font-weight="400">AI-generated review; not human review or approval. Review method: quick review, not independently</text><text x="64" y="682" fill="#52637b" font-family="Arial, sans-serif" font-size="16" font-weight="400">verified. Models: example/model</text><rect x="40" y="730" width="1120" height="288" rx="14" fill="#ffffff" stroke="#dce5ef"/><text x="64" y="770" fill="#172b4d" font-family="Arial, sans-serif" font-size="27" font-weight="700">PR Review Summary</text><text x="64" y="804" fill="#172b4d" font-family="Arial, sans-serif" font-size="20" font-weight="400">Adds pagination for a list of items.</text><text x="64" y="838" fill="#52637b" font-family="Arial, sans-serif" font-size="18" font-weight="400">high: 0 · medium: 1 · low: 0</text><rect x="64" y="856" width="1072" height="37" rx="5" fill="#edf5fd" stroke="none"/><text x="80" y="881" fill="#005a9e" font-family="Arial, sans-serif" font-size="17" font-weight="700">Severity</text><text x="232" y="881" fill="#005a9e" font-family="Arial, sans-serif" font-size="17" font-weight="700">Summary</text><text x="776" y="881" fill="#005a9e" font-family="Arial, sans-serif" font-size="17" font-weight="700">Location</text><text x="80" y="923" fill="#8a5900" font-family="Arial, sans-serif" font-size="19" font-weight="700">medium</text><text x="232" y="923" fill="#172b4d" font-family="Arial, sans-serif" font-size="19" font-weight="400">Q-1 — Later pages are empty</text><text x="776" y="923" fill="#172b4d" font-family="Consolas, monospace" font-size="17" font-weight="400">head:/src/pagination.js:3</text><text x="64" y="963" fill="#52637b" font-family="Arial, sans-serif" font-size="16" font-weight="400">AI-generated review; not human review or approval. Review method: quick review, not independently</text><text x="64" y="986" fill="#52637b" font-family="Arial, sans-serif" font-size="16" font-weight="400">verified. Models: example/model</text><text x="42" y="1059" fill="#52637b" font-family="Arial, sans-serif" font-size="16" font-weight="400">No live model call or Azure publication. Colors and spacing are illustrative; comment text is renderer-generated.</text></svg>
